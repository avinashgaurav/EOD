name: release

# Push a tag like v1.0.0 and this builds EOD.app (universal, signed with the EOD certificate) on a
# Mac runner and attaches EOD.zip to a GitHub release for that tag. The one-line
# installer always downloads the latest release's EOD.zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: xcode-select -p && swiftc --version
      - name: Tests
        run: ./run_tests.sh
      - name: Build EOD.app
        env:
          # One long-lived self-signed certificate, so macOS keeps Keychain and
          # Calendar permissions across updates. Unset (forks): signs ad-hoc.
          EOD_SIGN_P12: ${{ secrets.EOD_SIGN_P12 }}
          EOD_SIGN_P12_PASSWORD: ${{ secrets.EOD_SIGN_P12_PASSWORD }}
        run: VERSION="${GITHUB_REF_NAME#v}" macos/build.sh
      - name: Check the signature is the stable one
        run: |
          codesign -v macos/build/EOD.app
          codesign -d -r- macos/build/EOD.app 2>&1 | grep -q 'certificate leaf = H"9f7240f887bda3a91ad775839ac269fb4c6fb020"' \
            || { echo "EOD.app is not signed with the EOD certificate"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd macos/build && shasum -a 256 EOD.zip > EOD.zip.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" macos/build/EOD.zip macos/build/EOD.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" macos/build/EOD.zip macos/build/EOD.zip.sha256 \
              --title "EOD $GITHUB_REF_NAME" \
              --notes "Install: curl -fsSL https://eodreceipt.vercel.app/install.sh | bash"
          fi
