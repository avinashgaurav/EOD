name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what ships with macOS Command Line Tools, which is what most
        # users will actually run this on. 3.12 catches anything deprecated.
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install lua (for the eod.lua syntax check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Run the suite
        run: ./run_tests.sh

      - name: Check the docs still match the code
        run: |
          # These files are read at runtime but easy to rename without noticing.
          for f in exclude.txt repos.txt polish.off signature.txt; do
            grep -q "$f" extract.py || { echo "::error::$f is documented but no longer read by extract.py"; exit 1; }
            grep -q "$f" README.md  || { echo "::error::$f is read by extract.py but missing from README.md"; exit 1; }
          done
          echo "all four config files are both read and documented"

      - name: Check no hardcoded author mark crept back in
        run: |
          if grep -q "tamper-guard" extract.py; then
            echo "::error::the self-restoring signature guard is back"; exit 1
          fi
          if grep -qE "map\(chr, \(65, 71\)\)" extract.py; then
            echo "::error::the obfuscated author initials are back"; exit 1
          fi
          echo "signature is still user-derived"
